name: Regenerate Firebase Admin lockfile

on:
  push:
    branches:
      - security/firebase-mfa-step-up-hardening
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: firebase-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.ref == 'refs/heads/security/firebase-mfa-step-up-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Generate complete package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean locked installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify package declaration and lockfile consistency
        run: node scripts/check-dependency-controls.mjs

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firebase-dependency-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
