name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pieroloos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pieroloos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_ENV: ci
      NEXTAUTH_SECRET: ci-only-not-a-deployment-secret
      DATABASE_URL_CI: postgresql://postgres:postgres@localhost:5432/pieroloos_ci?schema=public
      SHADOW_DATABASE_URL_CI: postgresql://postgres:postgres@localhost:5432/pieroloos_shadow?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pieroloos_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create disposable shadow database
        # psql rejects Prisma's "?schema=" query parameter, so strip it for the admin connection.
        run: psql "${DATABASE_URL_CI%%\?*}" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pieroloos_shadow;'

      - name: Validate, migrate, and verify PostgreSQL
        run: npm run db:deploy -- ci

      - name: Test PostgreSQL data integrity
        run: npm run test:db

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    # Browser tests for the public, signed-out surface in every locale. Authenticated routes need an OIDC test
    # identity provider, which is not provisioned; see docs/INTERNATIONALIZATION.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXTAUTH_SECRET: ci-only-not-a-deployment-secret
      # Placeholder so Prisma can load its config; the signed-out public routes under test do not query the database.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
