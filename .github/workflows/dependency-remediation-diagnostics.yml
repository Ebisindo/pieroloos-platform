name: Dependency remediation diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-remediation-diagnostics.yml"
      - ".github/workflows/dependency-remediation-candidate.yml"

permissions:
  contents: read

concurrency:
  group: dependency-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-diagnostics:
    name: Node 22 dependency, audit and reproducibility diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Record toolchain and manifest ranges
        run: |
          node --version
          npm --version
          node -e "const p=require('./package.json'); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies,overrides:p.overrides},null,2))"

      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record installed versions
        run: |
          mkdir -p dependency-evidence
          npm ls next eslint @eslint/js @eslint-react/eslint-plugin typescript-eslint eslint-plugin-react-hooks globals prisma @prisma/client @prisma/config deepmerge-ts braces micromatch fast-glob --all > dependency-evidence/npm-ls.txt 2>&1 || true
          node -e "for (const n of ['next','eslint','@eslint/js','@eslint-react/eslint-plugin','typescript-eslint','eslint-plugin-react-hooks','globals','prisma','@prisma/client','@prisma/config','deepmerge-ts','braces','micromatch','fast-glob']) { try { const p=require(n+'/package.json'); console.log(n+'='+p.version) } catch(e) { console.log(n+'=not directly resolvable') } }" > dependency-evidence/installed-versions.txt

      - name: Capture full npm audit report
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --json > dependency-evidence/npm-audit.json
          code=$?
          set -e
          printf 'npm_audit_exit_code=%s\n' "$code" > dependency-evidence/npm-audit-exit-code.txt
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('dependency-evidence/npm-audit.json','utf8')); const report={metadata:a.metadata?.vulnerabilities ?? null, advisories:Object.entries(a.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable,nodes:v.nodes}))}; fs.writeFileSync('dependency-evidence/npm-audit-summary.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report.metadata,null,2))"

      - name: Check manifest and lockfile root consistency
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = l.packages?.[''];
          if (!root) throw new Error('package-lock.json lacks packages[""] root entry');
          const differences = [];
          for (const group of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            const a = p[group] || {};
            const b = root[group] || {};
            for (const name of new Set([...Object.keys(a), ...Object.keys(b)])) {
              if (a[name] !== b[name]) differences.push({group, name, manifest:a[name] ?? null, lock:b[name] ?? null});
            }
          }
          const latest = [];
          for (const group of ['dependencies','devDependencies','optionalDependencies']) {
            for (const [name, version] of Object.entries(p[group] || {})) if (version === 'latest') latest.push({group,name});
          }
          const resolved = {};
          for (const name of ['eslint','@eslint/js','@eslint-react/eslint-plugin','typescript-eslint','eslint-plugin-react-hooks','globals','next','prisma','@prisma/client','deepmerge-ts']) {
            const entry = l.packages?.['node_modules/' + name];
            resolved[name] = entry?.version ?? null;
          }
          fs.writeFileSync('dependency-evidence/manifest-lock-consistency.json', JSON.stringify({differences, directDependenciesUsingLatest:latest, resolvedVersions:resolved}, null, 2));
          console.log(JSON.stringify({differences, directDependenciesUsingLatest:latest, resolvedVersions:resolved}, null, 2));
          if (differences.length) {
            console.error('The package-lock root dependency declarations must match package.json ranges exactly.');
            process.exitCode = 1;
          }
          if (latest.length) {
            console.error('Pin direct dependency declarations instead of using latest.');
            process.exitCode = 1;
          }
          const eslintMajor = Number.parseInt(resolved.eslint || '0', 10);
          const requiredToolchain = ['@eslint/js','@eslint-react/eslint-plugin','typescript-eslint','eslint-plugin-react-hooks','globals'];
          const missingToolchain = requiredToolchain.filter(name => !resolved[name]);
          const direct = {...(p.dependencies || {}), ...(p.devDependencies || {}), ...(p.optionalDependencies || {})};
          const legacyDirect = ['eslint-config-next','@next/eslint-plugin-next','eslint-plugin-jsx-a11y','eslint-plugin-react'].filter(name => Object.hasOwn(direct,name));
          if (eslintMajor < 10 || missingToolchain.length || legacyDirect.length) {
            console.error(JSON.stringify({eslintMajor,missingToolchain,legacyDirect}, null, 2));
            console.error('Expected ESLint 10 with the maintained React toolchain; do not reintroduce legacy plugins with incompatible peer ranges.');
            process.exitCode = 1;
          }
          NODE

      - name: Upload audit and dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-remediation-evidence
          path: dependency-evidence/
          if-no-files-found: warn
          retention-days: 30
