name: Security checks

# npm audit is a required lockfile control, but not a diff-aware replacement for native Dependency Review.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Create dependency evidence directory
        run: mkdir -p dependency-evidence
      - name: Check lockfile consistency and GitHub Actions pinning
        run: node scripts/check-dependency-controls.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record outdated dependency report
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm outdated --json > dependency-evidence/npm-outdated.json 2> dependency-evidence/npm-outdated.stderr
          status=$?
          set -e
          printf 'npm_outdated_exit_code=%s\\n' "$status" > dependency-evidence/npm-outdated-exit-code.txt
          if [ "$status" -gt 1 ]; then
            cat dependency-evidence/npm-outdated.stderr
            exit "$status"
          fi
      - name: Audit locked dependency tree
        run: npm audit --audit-level=high 2>&1 | tee dependency-evidence/npm-audit-all.log
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee dependency-evidence/npm-audit-production.log
      - name: Upload dependency review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-maintenance-evidence
          path: dependency-evidence/
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@42213152a85ae7569bdb6bec7bcd74cd691bfe41 # v3.30.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@42213152a85ae7569bdb6bec7bcd74cd691bfe41 # v3.30.9

  secret-scan:
    name: Secret scanning with Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
