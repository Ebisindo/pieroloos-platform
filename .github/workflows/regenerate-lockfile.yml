name: Regenerate npm lockfile

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to regenerate package-lock.json on"
        required: true
        default: "security/firebase-mfa-step-up-runtime"
        type: string

permissions:
  contents: write

concurrency:
  group: npm-lockfile-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from manifest
        run: npm install firebase-admin@13.5.0 --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean locked install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Firebase Admin package is locked
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const wanted = manifest.dependencies['firebase-admin'];
          const root = lock.packages?.[''];
          const resolved = lock.packages?.['node_modules/firebase-admin'];
          if (!wanted || root?.dependencies?.['firebase-admin'] !== wanted || !resolved?.version) {
            throw new Error('firebase-admin is not completely represented in package-lock.json');
          }
          if (!resolved.resolved || !resolved.integrity) {
            throw new Error('firebase-admin package lacks resolved URL or integrity metadata');
          }
          console.log(`Verified firebase-admin ${resolved.version} satisfies manifest range ${wanted}`);
          NODE

      - name: Commit regenerated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the manifest; no commit required."
            exit 0
          fi
          git commit -m "chore(deps): regenerate npm lockfile for Firebase Admin"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"
