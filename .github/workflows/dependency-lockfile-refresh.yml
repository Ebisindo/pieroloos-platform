name: Dependency update proposal

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Approved dependency maintenance request or issue reference"
        required: true
        type: string
      run_full_audit:
        description: "Run full and production dependency audits"
        required: true
        default: true
        type: boolean

# This workflow is deliberately read-only. It creates no commits, pushes no branches,
# and does not dispatch other workflows. A human reviews its artifacts and opens a PR.
permissions:
  contents: read

concurrency:
  group: dependency-update-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Record toolchain and request context
        run: |
          node --version
          npm --version
          printf 'request=%s\n' "${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate lockfile in ephemeral workspace
        run: npm install --package-lock-only --ignore-scripts --no-fund --engine-strict=false

      - name: Validate lockfile and manifest consistency
        run: node scripts/check-dependency-controls.mjs

      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-fund

      - name: Full dependency audit
        if: ${{ inputs.run_full_audit }}
        run: npm audit --audit-level=high

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Publish proposal diff (no repository write)
        run: |
          git --no-pager diff -- package.json package-lock.json > dependency-update-proposal.diff
          git --no-pager diff --stat -- package.json package-lock.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review-only dependency proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-update-proposal
          path: |
            package.json
            package-lock.json
            dependency-update-proposal.diff
          if-no-files-found: error
          retention-days: 14
